name: Android APK Build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "YiddishLearner-debug.apk"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore Hebrew translation cache
        uses: actions/cache@v4
        with:
          path: .cache/yiddish_glosses_he.json
          key: yiddish-he-v1-${{ hashFiles('tools/build_yiddish_dictionary.py') }}
          restore-keys: |
            yiddish-he-v1-
      - name: Install Hebrew translation engine
        run: python -m pip install --disable-pip-version-check argostranslate==1.9.6
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare offline 10,000-word Yiddish-Hebrew dictionary
        run: python tools/build_yiddish_dictionary.py
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YiddishLearner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to repository root
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk YiddishLearner-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add YiddishLearner-debug.apk
          if git diff --cached --quiet; then
            echo "APK is unchanged; no new commit needed."
            exit 0
          fi
          git commit -m "Publish built Yiddish Learner APK"
          git push
