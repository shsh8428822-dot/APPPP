name: Android APK Build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "YiddishLearner-debug.apk"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare offline 10,000-word Yiddish dictionary
        run: python3 tools/build_yiddish_dictionary.py
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YiddishLearner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to repository root
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk YiddishLearner-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add YiddishLearner-debug.apk
          if git diff --cached --quiet; then
            echo "APK is unchanged; no new commit needed."
            exit 0
          fi
          git commit -m "Publish built Yiddish Learner APK"
          git push
